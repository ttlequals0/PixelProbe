<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelProbe - Login</title>
    <link rel="icon" type="image/png" href="/static/images/pixelprobe-logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        :root {
            /* Primary colors */
            --primary-green: #1ce783;
            --primary-black: #040405;
            --gradient-start: #040405;
            --gradient-end: #183949;

            /* Light mode colors */
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e9ecef;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --border-color: #dee2e6;
            --shadow-sm: 0 0.125rem 0.25rem rgba(0,0,0,0.075);
            --shadow-md: 0 0.5rem 1rem rgba(0,0,0,0.15);

            /* Component colors */
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --info-color: #17a2b8;
        }

        /* Dark mode variables */
        body.dark-mode {
            --bg-primary: #0a0a0b;
            --bg-secondary: #1a1a1b;
            --bg-tertiary: #2a2a2b;
            --text-primary: #ffffff;
            --text-secondary: #adb5bd;
            --border-color: #343a40;
            --shadow-sm: 0 0.125rem 0.25rem rgba(0,0,0,0.5);
            --shadow-md: 0 0.5rem 1rem rgba(0,0,0,0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s ease;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #0a0a0b 0%, #1a1a1b 100%);
        }

        .login-container {
            background: var(--bg-secondary);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            animation: slideUp 0.5s ease;
            position: relative;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin-bottom: 15px;
        }

        h1 {
            color: var(--text-primary);
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            transition: all 0.3s;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(28, 231, 131, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        input[type="checkbox"] {
            margin-right: 8px;
        }

        .checkbox-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(0, 0, 0, 0.15);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background-color: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .success-message {
            background-color: #efe;
            color: #3c3;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .first-run-notice {
            background-color: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .password-requirements {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        /* Theme toggle */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            background: var(--bg-tertiary);
        }

        .theme-toggle i {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">
            <i class="fas fa-moon" id="themeIcon"></i>
        </button>
        <div class="logo-container">
            <img src="/static/images/pixelprobe-logo.png" alt="PixelProbe Logo" class="logo">
            <h1>PixelProbe</h1>
            <p class="subtitle">Media Corruption Detection System</p>
        </div>

        <div id="firstRunNotice" class="first-run-notice" style="display: none;">
            <strong>Welcome!</strong> This is your first time using PixelProbe.
            Please create an admin password to get started.
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="loginForm">
            <div id="usernameGroup" class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>

            <div id="emailGroup" class="form-group" style="display: none;">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" minlength="8">
                <div id="passwordRequirements" class="password-requirements" style="display: none;">
                    Minimum 8 characters required
                </div>
            </div>

            <div id="confirmPasswordGroup" class="form-group" style="display: none;">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="8">
                <div id="passwordMismatch" class="error-message" style="display: none;">
                    Passwords do not match
                </div>
            </div>

            <div id="rememberGroup" class="checkbox-group">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember" class="checkbox-label">Remember me</label>
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">Sign In</span>
                <div class="loading-spinner" id="loadingSpinner"></div>
            </button>
        </form>
    </div>

    <script>
        let isFirstRun = false;
        let setupMode = false;

        // Theme management
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        // Load saved theme or default to light mode
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeIcon.className = 'fas fa-sun';
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            themeIcon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // Check authentication status on load
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/auth/status');
                const data = await response.json();

                if (data.authenticated) {
                    // Already logged in, redirect to main page
                    window.location.href = '/';
                    return;
                }

                if (data.first_run) {
                    // First run - setup mode
                    isFirstRun = true;
                    setupMode = true;
                    document.getElementById('firstRunNotice').style.display = 'block';
                    document.getElementById('usernameGroup').style.display = 'none';
                    document.getElementById('rememberGroup').style.display = 'none';
                    document.getElementById('passwordRequirements').style.display = 'block';
                    document.getElementById('confirmPasswordGroup').style.display = 'block';
                    document.getElementById('confirmPassword').setAttribute('required', 'required');
                    document.getElementById('btnText').textContent = 'Create Admin Account';
                    document.getElementById('username').removeAttribute('required');
                    document.getElementById('password').setAttribute('autocomplete', 'new-password');
                }
            } catch (error) {
                console.error('Failed to check auth status:', error);
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('loadingSpinner');

            // Hide messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            // Show loading
            submitBtn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Check password match for first run
            if (setupMode && password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                btnText.style.display = 'inline';
                spinner.style.display = 'none';
                return;
            }

            try {
                let response;

                if (isFirstRun && setupMode) {
                    // First run setup
                    response = await fetch('/api/auth/setup', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ password })
                    });
                } else {
                    // Normal login
                    const username = document.getElementById('username').value || 'admin';
                    const remember = document.getElementById('remember').checked;

                    response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ username, password, remember })
                    });
                }

                const data = await response.json();

                if (response.ok) {
                    successDiv.textContent = data.message || 'Login successful!';
                    successDiv.style.display = 'block';

                    // Redirect to main page after a short delay
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                } else {
                    // Check for first-time setup requirement
                    if (data.first_setup) {
                        setupMode = true;
                        document.getElementById('firstRunNotice').style.display = 'block';
                        document.getElementById('firstRunNotice').innerHTML =
                            '<strong>First-Time Setup</strong><br>' +
                            'The admin account exists but needs a password. ' +
                            'Please enter a new password (minimum 8 characters).';
                        document.getElementById('passwordRequirements').style.display = 'block';
                        document.getElementById('confirmPasswordGroup').style.display = 'block';
                        document.getElementById('confirmPassword').setAttribute('required', 'required');
                        document.getElementById('btnText').textContent = 'Set Password';
                        document.getElementById('password').value = '';
                        document.getElementById('confirmPassword').value = '';
                        document.getElementById('password').setAttribute('autocomplete', 'new-password');
                        document.getElementById('password').focus();
                    } else {
                        errorDiv.textContent = data.error || 'Login failed';
                        errorDiv.style.display = 'block';
                    }
                }
            } catch (error) {
                errorDiv.textContent = 'Connection failed. Please try again.';
                errorDiv.style.display = 'block';
                console.error('Login error:', error);
            } finally {
                // Reset button
                submitBtn.disabled = false;
                btnText.style.display = 'inline';
                spinner.style.display = 'none';
            }
        });

        // Auto-focus username or password field
        window.addEventListener('load', () => {
            if (isFirstRun || setupMode) {
                document.getElementById('password').focus();
            } else {
                document.getElementById('username').focus();
            }
        });
    </script>
</body>
</html>
