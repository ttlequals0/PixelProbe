version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: pixelprobe-postgres
    environment:
      POSTGRES_DB: pixelprobe
      POSTGRES_USER: pixelprobe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelprobe"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pixelprobe-network

  # Redis for P1 Celery implementation (currently unused but scaffolded)
  redis:
    image: redis:7-alpine
    container_name: pixelprobe-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pixelprobe-network

  # PixelProbe application
  pixelprobe:
    image: ttlequals0/pixelprobe:2.2.39
    container_name: pixelprobe-app
    environment:
      # Security
      SECRET_KEY: ${SECRET_KEY}
      
      # PostgreSQL database configuration
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pixelprobe
      POSTGRES_USER: pixelprobe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      
      # P1 Celery configuration (scaffolded for future implementation)
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      
      # Application settings
      FLASK_ENV: ${FLASK_ENV:-production}
      SCAN_PATHS: ${SCAN_PATHS:-/media}
      EXCLUDED_PATHS: ${EXCLUDED_PATHS:-}
      EXCLUDED_EXTENSIONS: ${EXCLUDED_EXTENSIONS:-.txt,.log,.md}
      MAX_WORKERS: ${MAX_WORKERS:-10}
      BATCH_SIZE: ${BATCH_SIZE:-100}
      MAX_OUTPUT_SIZE: ${MAX_OUTPUT_SIZE:-10000}
      OUTPUT_ROTATION_ENABLED: ${OUTPUT_ROTATION_ENABLED:-true}
      
      # Scheduled scans
      PERIODIC_SCAN_SCHEDULE: ${PERIODIC_SCAN_SCHEDULE:-}
      CLEANUP_SCHEDULE: ${CLEANUP_SCHEDULE:-}
      
    volumes:
      # Media files to scan
      - ${MEDIA_PATH:-./media}:/media:ro
      
      # Instance folder for configs (no database files with PostgreSQL)
      - ./instance:/app/instance
      
    ports:
      - "${PORT:-5000}:5000"
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    networks:
      - pixelprobe-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # P1 Celery Worker for distributed task processing
  celery-worker:
    image: ttlequals0/pixelprobe:2.2.39
    container_name: pixelprobe-celery-worker
    command: python celery_worker.py
    environment:
      # Celery configuration
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_LOG_LEVEL: ${CELERY_LOG_LEVEL:-INFO}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-4}
      
      # Database connection (worker needs database access)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pixelprobe
      POSTGRES_USER: pixelprobe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      
      # Worker-specific settings
      SECRET_KEY: ${SECRET_KEY}
      FLASK_ENV: ${FLASK_ENV:-production}
      
    volumes:
      # Media files access (read-only for scanning)
      - ${MEDIA_PATH:-./media}:/media:ro
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    networks:
      - pixelprobe-network
    
    restart: unless-stopped

  # P1 Flower monitoring dashboard (optional)
  flower:
    image: ttlequals0/pixelprobe:2.2.39
    container_name: pixelprobe-flower
    command: python flower_monitor.py
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_PORT: 5555
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pixelprobe-network
    restart: unless-stopped
    profiles:
      - monitoring


networks:
  pixelprobe-network:
    driver: bridge

volumes:
  postgres_data: