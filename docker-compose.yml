# Docker Compose configuration for PixelProbe
# Production deployment using latest stable image
#
# IMPORTANT: User Permissions
# - The pixelprobe app and celery-worker MUST run as the same user
# - This ensures both services can access mounted media files
# - Add 'user: "1000:1000"' (or your host user's UID:GID) to both services
# - Example: user: "${PUID:-1000}:${PGID:-1000}"
#
# Key Performance Settings:
# - CELERY_CONCURRENCY: Number of concurrent Celery tasks (default: 4)
#   * Directory scans are distributed as chunk tasks across these slots,
#     so this is the main scan-throughput knob (8-12 reasonable; chunk work
#     is mostly ffmpeg/imagemagick subprocess-bound)
#
# - MAX_WORKERS: Parallel workers for selected-file rescans (default: 10)
#
# Connection math (keep under PostgreSQL max_connections, default 100):
#   web: 4 gunicorn workers x (DB_POOL_SIZE 5 + DB_MAX_OVERFLOW 10) = 60 max
#   celery: CELERY_CONCURRENCY children x (5 + 10) worst-case, few in practice
#   plus ~MAX_WORKERS single checker connections during selected-file rescans

services:
  # PostgreSQL database
  # BREAKING (v2.7.0): default moved from postgres:15 to postgres:18. An
  # existing postgres_data volume created by 15 will NOT start on 18 -- follow
  # the migration guide in docs/docker-setup.md (dump on 15, restore into 18)
  # BEFORE pulling this compose file, or pin the image back to postgres:15-alpine.
  postgres:
    image: postgres:18-alpine
    container_name: pixelprobe-postgres
    environment:
      POSTGRES_DB: pixelprobe
      POSTGRES_USER: pixelprobe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      # postgres:18+ images require the mount at /var/lib/postgresql (NOT
      # .../data); data lives in a major-version subdirectory so future
      # upgrades can use pg_upgrade --link
      - postgres_data:/var/lib/postgresql
    # Not published to the host: app and worker reach it on the compose
    # network. For local debugging use: - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelprobe"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pixelprobe-network

  # Valkey (Redis-compatible) for Celery task broker. Drop-in replacement:
  # the service name stays "redis" so all redis:// URLs are unchanged.
  # Performance settings for large task queues (file changes check with 1M+ files):
  # - REDIS_MAX_MEMORY: Total memory for task queue (default: 2gb, recommended: 1-4gb)
  redis:
    image: valkey/valkey:9-alpine
    container_name: pixelprobe-redis
    command: >
      valkey-server
      --maxmemory ${REDIS_MAX_MEMORY:-2gb}
      --maxmemory-policy noeviction
    # Not published to the host: the broker has no auth and holds the
    # internal API secret. For local debugging use: - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pixelprobe-network

  # PixelProbe application
  pixelprobe:
    image: ttlequals0/pixelprobe:${PIXELPROBE_VERSION:-2.8.0}
    container_name: pixelprobe-app
    environment:
      # Security
      SECRET_KEY: ${SECRET_KEY}

      # Scheduler runs in celery-worker; keep the web container out of the
      # scheduler lock entirely (set to "true" only in single-container setups)
      SCHEDULER_ENABLED: "false"
      
      # PostgreSQL database configuration
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pixelprobe
      POSTGRES_USER: pixelprobe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      
      # Celery configuration
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      
      # Application settings
      FLASK_ENV: ${FLASK_ENV:-production}
      SCAN_PATHS: ${SCAN_PATHS:-/media}
      EXCLUDED_PATHS: ${EXCLUDED_PATHS:-}
      EXCLUDED_EXTENSIONS: ${EXCLUDED_EXTENSIONS:-.txt,.log,.md}
      MAX_WORKERS: ${MAX_WORKERS:-10}
      BATCH_SIZE: ${BATCH_SIZE:-100}
      MAX_OUTPUT_SIZE: ${MAX_OUTPUT_SIZE:-10000}
      OUTPUT_ROTATION_ENABLED: ${OUTPUT_ROTATION_ENABLED:-true}
      FREEZE_DETECTION_ENABLED: ${FREEZE_DETECTION_ENABLED:-true}
      PILLOW_BLOCKS_MAX: 256
      TZ: America/New_York


      # Scheduled scans
      PERIODIC_SCAN_SCHEDULE: ${PERIODIC_SCAN_SCHEDULE:-}
      CLEANUP_SCHEDULE: ${CLEANUP_SCHEDULE:-}

      # SSRF trusted hosts (hostnames/CIDRs that bypass private-IP blocking)
      TRUSTED_INTERNAL_HOSTS: ${TRUSTED_INTERNAL_HOSTS:-}

    volumes:
      # Media files to scan
      - ${MEDIA_PATH:-./media}:/media:ro
      
      # Instance folder for configs (no database files with PostgreSQL)
      - ./instance:/app/instance
      
    ports:
      - "${PORT:-5000}:5000"
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    networks:
      - pixelprobe-network
    
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # migrations run before workers serve requests

  # P1 Celery Worker for distributed task processing
  celery-worker:
    image: ttlequals0/pixelprobe:${PIXELPROBE_VERSION:-2.8.0}
    container_name: pixelprobe-celery-worker
    command: python celery_worker.py
    environment:
      # Celery configuration
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_LOG_LEVEL: ${CELERY_LOG_LEVEL:-INFO}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-4}
      
      # Database connection (worker needs database access)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pixelprobe
      POSTGRES_USER: pixelprobe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      
      # Worker-specific settings
      SECRET_KEY: ${SECRET_KEY}
      FLASK_ENV: ${FLASK_ENV:-production}
      MAX_WORKERS: ${MAX_WORKERS:-10}  # Parallel file scanning workers per task
      FREEZE_DETECTION_ENABLED: ${FREEZE_DETECTION_ENABLED:-true}
      PILLOW_BLOCKS_MAX: 256

      # Scan configuration (required for scheduler)
      SCAN_PATHS: ${SCAN_PATHS:-/media}
      EXCLUDED_PATHS: ${EXCLUDED_PATHS:-}
      EXCLUDED_EXTENSIONS: ${EXCLUDED_EXTENSIONS:-.txt,.log,.md}

      # Scheduled scans (scheduler runs in celery-worker)
      PERIODIC_SCAN_SCHEDULE: ${PERIODIC_SCAN_SCHEDULE:-}
      CLEANUP_SCHEDULE: ${CLEANUP_SCHEDULE:-}

      # SSRF trusted hosts (hostnames/CIDRs that bypass private-IP blocking)
      TRUSTED_INTERNAL_HOSTS: ${TRUSTED_INTERNAL_HOSTS:-}

      TZ: America/New_York

    volumes:
      # Media files access (read-only for scanning)
      - ${MEDIA_PATH:-./media}:/media:ro
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    networks:
      - pixelprobe-network
    
    restart: unless-stopped


networks:
  pixelprobe-network:
    driver: bridge

volumes:
  postgres_data: