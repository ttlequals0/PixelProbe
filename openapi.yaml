  /mark-as-good:
    post:
      summary: Mark files as good (healthy)
      description: |
        Mark multiple files as good/healthy (batch operation).

        **Example:**
        ```bash
        curl -X POST http://your-server/api/mark-as-good \
          -H "Authorization: Bearer YOUR_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"file_ids": [123, 456, 789]}'
        ```
      tags: [Maintenance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_ids]
              properties:
                file_ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Files marked as good successfully

  /bitrot/accept:
    post:
      summary: Accept current state of bitrot-suspected files
      description: |
        Adopt each flagged file's current content as the new integrity
        baseline (the candidate hash plus the mtime recorded when that hash
        was computed), clearing the bitrot_suspected flag and stability
        counter. The detection record (bitrot_detected_date, bitrot_details)
        is preserved permanently. Files that are not flagged are skipped and
        reported back.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/bitrot/accept \
          -H "Authorization: Bearer YOUR_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"file_ids": [123, 456]}'
        ```
      tags: [Maintenance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_ids]
              properties:
                file_ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Accepted; response lists accepted count and skipped ids

  /schedules:
    get:
      summary: List scheduled scans
      description: |
        Get all scan schedules.

        **Example:**
        ```bash
        curl -X GET http://your-server/api/schedules \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Admin]
      responses:
        '200':
          description: Schedules retrieved successfully

    post:
      summary: Create schedule
      description: |
        Create a new scan schedule.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/schedules \
          -H "Authorization: Bearer YOUR_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "name": "Nightly Scan",
            "cron_expression": "0 2 * * *",
            "scan_paths": ["/media"],
            "scan_type": "full",
            "force_rescan": false
          }'
        ```
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, cron_expression]
              properties:
                name:
                  type: string
                cron_expression:
                  type: string
                scan_paths:
                  type: array
                  items:
                    type: string
                scan_type:
                  type: string
                  enum: [full, parallel]
                  default: full
                force_rescan:
                  type: boolean
                  default: false
                time_budget_minutes:
                  type: integer
                  nullable: true
                  minimum: 1
                  description: |
                    file_changes schedules only. Soft per-run deadline in
                    minutes; dispatch stops when it expires and the rolling
                    integrity queue resumes at the next run. Null = unlimited.
      responses:
        '201':
          description: Schedule created successfully

  /schedules/{schedule_id}:
    put:
      summary: Update schedule
      description: |
        Update an existing scan schedule.

        **Example:**
        ```bash
        curl -X PUT http://your-server/api/schedules/1 \
          -H "Authorization: Bearer YOUR_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"is_active": false}'
