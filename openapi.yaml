      tags: [Admin]
      parameters:
        - name: schedule_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                cron_expression:
                  type: string
                scan_paths:
                  type: array
                  items:
                    type: string
                scan_type:
                  type: string
                force_rescan:
                  type: boolean
                is_active:
                  type: boolean
      responses:
        '200':
          description: Schedule updated successfully

    delete:
      summary: Delete schedule
