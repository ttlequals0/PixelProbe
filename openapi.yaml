      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paths:
                  type: array
                  items:
                    type: string
                extensions:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Exclusions updated successfully

  /exclusions/{type}:
    post:
      summary: Add exclusion
      description: |
        Add a file or directory exclusion pattern.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/exclusions/extension \
          -H "Authorization: Bearer YOUR_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"value": ".tmp"}'
        ```
      tags: [Configuration]
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [path, extension]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
      responses:
        '200':
          description: Exclusion added successfully

    delete:
      summary: Remove exclusion
      description: |
        Remove an exclusion pattern.

        **Example:**
        ```bash
        curl -X DELETE http://your-server/api/exclusions/extension \
          -H "Authorization: Bearer YOUR_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"value": ".tmp"}'
        ```
      tags: [Configuration]
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [path, extension]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
      responses:
        '200':
          description: Exclusion removed successfully

  # Export Endpoints
  /view/{result_id}:
    get:
      summary: View/stream file
      description: |
        Stream a media file for viewing. Supports range requests for video streaming.

        **Example:**
        ```bash
        curl -X GET http://your-server/api/view/123 \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Export]
      parameters:
        - name: result_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: File served successfully
        '206':
          description: Partial content (range request)
        '404':
          description: File not found

  /download/{result_id}:
    get:
      summary: Download file
      description: |
        Download a media file.

        **Example:**
        ```bash
        curl -X GET http://your-server/api/download/123 \
          -H "Authorization: Bearer YOUR_TOKEN" \
          --output file.mp4
        ```
      tags: [Export]
      parameters:
        - name: result_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: File download started
        '404':
          description: File not found

  /export:
    get:
      summary: Export scan results (GET)
      description: |
        Export scan results to CSV, JSON, or PDF via GET request.

        **Example:**
        ```bash
        curl -X GET "http://your-server/api/export?format=csv&filter=corrupted" \
          -H "Authorization: Bearer YOUR_TOKEN" \
          --output results.csv
        ```
      tags: [Export]
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, json, pdf]
            default: csv
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, corrupted, healthy, pending, error]
            default: all
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Export file generated and returned

    post:
      summary: Export scan results (POST)
      description: |
        Export scan results to various formats (CSV, JSON, Excel, PDF).

        **Example:**
        ```bash
        curl -X POST http://your-server/api/export \
          -H "Authorization: Bearer YOUR_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "format": "csv",
            "filter": "corrupted"
          }' \
          --output results.csv
        ```
      tags: [Export]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format:
                  type: string
                  enum: [csv, json, excel, pdf]
                filter:
                  type: string
                  enum: [all, corrupted, healthy, pending, warning]
                search:
                  type: string
                file_ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Export file generated and returned

  # Maintenance Endpoints
  /cleanup-orphaned:
    post:
      summary: Cleanup orphaned database entries
      description: |
        Start cleanup of orphaned database entries.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/cleanup-orphaned \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Maintenance]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                file_paths:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Cleanup started successfully
        '409':
          description: Cleanup already in progress

  /cleanup-status:
    get:
      summary: Get cleanup operation status
      description: |
        Get current cleanup operation status.

        **Example:**
        ```bash
        curl -X GET http://your-server/api/cleanup-status \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Maintenance]
      responses:
        '200':
          description: Cleanup status retrieved successfully

  /cancel-cleanup:
    post:
      summary: Cancel cleanup operation
      description: |
        Cancel the current cleanup operation.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/cancel-cleanup \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Maintenance]
      responses:
        '200':
          description: Cleanup cancellation requested
        '400':
          description: No active cleanup to cancel

  /reset-cleanup-state:
    post:
      summary: Force reset cleanup state
      description: |
        Force reset cleanup state in case of stuck operation.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/reset-cleanup-state \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Maintenance]
      responses:
        '200':
          description: Cleanup state reset successfully

  /file-changes:
    get:
      summary: Check for file changes (GET)
      description: |
        Check for file changes since last scan (GET request).

        **Example:**
        ```bash
        curl -X GET http://your-server/api/file-changes \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Maintenance]
      responses:
        '200':
          description: File changes check started

    post:
      summary: Check for file changes (POST)
      description: |
        Check for file changes since last scan (POST request).

        **Example:**
        ```bash
        curl -X POST http://your-server/api/file-changes \
          -H "Authorization: Bearer YOUR_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"file_paths": ["/media/movie.mp4"]}'
        ```
      tags: [Maintenance]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                file_paths:
                  type: array
                  items:
                    type: string
                time_budget_minutes:
                  type: integer
                  minimum: 1
                  description: |
                    Optional soft deadline in minutes. Dispatch stops when it
                    expires; in-flight hashes drain and the rolling queue
                    resumes at the next run. Omitted = unlimited (scheduled
                    runs inherit their schedule's budget).
      responses:
        '200':
          description: File changes check started
        '400':
          description: Invalid time_budget_minutes
        '409':
          description: Check already in progress

  /file-changes-status:
    get:
      summary: Get file changes check status
      description: |
        Get current file changes check operation status.

        **Example:**
        ```bash
        curl -X GET http://your-server/api/file-changes-status \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Maintenance]
      responses:
        '200':
          description: File changes status retrieved successfully

  /cancel-file-changes:
    post:
      summary: Cancel file changes check
      description: |
        Cancel the current file changes check operation.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/cancel-file-changes \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Maintenance]
      responses:
        '200':
          description: File changes check cancellation requested
        '400':
          description: No active check to cancel

  /reset-file-changes-state:
    post:
      summary: Force reset file changes state
      description: |
        Force reset file changes state in case of stuck operation.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/reset-file-changes-state \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Maintenance]
      responses:
        '200':
          description: File changes state reset successfully

  /vacuum:
    post:
      summary: Vacuum database
      description: |
        Vacuum the database to optimize storage (PostgreSQL VACUUM command).

        **Example:**
        ```bash
        curl -X POST http://your-server/api/vacuum \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Maintenance]
      responses:
        '200':
          description: Database vacuum completed successfully
        '400':
          description: Not supported for this database type

  # Reports Endpoints
  /scan-reports:
    get:
      summary: List scan reports
      description: |
        Get paginated scan reports with optional filters.

        **Example:**
        ```bash
        curl -X GET "http://your-server/api/scan-reports?page=1&per_page=20&status=completed" \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Reports]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: scan_type
          in: query
          schema:
            type: string
            enum: [all, full_scan, rescan, cleanup, file_changes]
            default: all
        - name: status
          in: query
          schema:
            type: string
            enum: [all, completed, failed, running]
            default: all
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Reports retrieved successfully

  /scan-reports/{report_id}:
    get:
      summary: Get scan report details
      description: |
        Get detailed information about a specific scan report.

        **Example:**
        ```bash
        curl -X GET http://your-server/api/scan-reports/abc-123-def \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Reports]
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Report retrieved successfully
        '404':
          description: Report not found

    delete:
      summary: Delete scan report
      description: |
        Delete a scan report by ID.

        **Example:**
        ```bash
        curl -X DELETE http://your-server/api/scan-reports/abc-123-def \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Reports]
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Report deleted successfully
        '404':
          description: Report not found

  /scan-reports/{report_id}/export:
    get:
      summary: Export scan report as JSON
      description: |
        Export scan report as JSON with full scan results.

        **Example:**
        ```bash
        curl -X GET http://your-server/api/scan-reports/abc-123-def/export \
          -H "Authorization: Bearer YOUR_TOKEN" \
          --output report.json
        ```
      tags: [Reports]
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Report exported successfully
        '404':
          description: Report not found

  /generate-pdf-report/{scan_type}/{scan_id}:
    get:
      summary: Generate PDF report
      description: |
        Generate PDF report for scan results.

        **Example:**
        ```bash
        curl -X GET http://your-server/api/generate-pdf-report/full_scan/abc-123 \
          -H "Authorization: Bearer YOUR_TOKEN" \
          --output report.pdf
        ```
      tags: [Reports]
      parameters:
        - name: scan_type
          in: path
          required: true
          schema:
            type: string
            enum: [full_scan, rescan, cleanup]
        - name: scan_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PDF report generated successfully
        '500':
          description: PDF generation failed

  /scan-reports/{report_id}/pdf:
    get:
      summary: Download scan report as PDF
      description: |
        Download scan report as PDF for compliance.

        **Example:**
        ```bash
        curl -X GET http://your-server/api/scan-reports/abc-123-def/pdf \
          -H "Authorization: Bearer YOUR_TOKEN" \
          --output report.pdf
        ```
      tags: [Reports]
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PDF report generated successfully
        '404':
          description: Report not found
        '500':
          description: PDF generation failed

  /scan-reports/latest:
    get:
      summary: Get latest reports
      description: |
        Get the latest report for each scan type.

        **Example:**
        ```bash
        curl -X GET http://your-server/api/scan-reports/latest \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Reports]
      responses:
        '200':
          description: Latest reports retrieved successfully

  /reports/download-multiple:
    post:
      summary: Download multiple reports
      description: |
        Download multiple reports as a zip file or combined PDF.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/reports/download-multiple \
          -H "Authorization: Bearer YOUR_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "report_ids": ["abc-123", "def-456"],
            "format": "zip"
          }' \
          --output reports.zip
        ```
      tags: [Reports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report_ids]
              properties:
                report_ids:
                  type: array
                  items:
                    type: string
                format:
                  type: string
                  enum: [zip, pdf]
                  default: zip
      responses:
        '200':
          description: Multiple reports downloaded successfully
        '400':
          description: No report IDs provided
        '404':
          description: No valid reports found

  # Logs Endpoints
  /logs:
    get:
      summary: Get paginated log entries
      description: |
        Retrieve log entries with filtering, pagination, and polling support.
        Use the `since` parameter for live polling (returns only newer entries, max 1000).

        **Example:**
        ```bash
        curl -X GET "http://your-server/api/logs?level=ERROR&per_page=50" \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Logs]
      parameters:
        - name: since
          in: query
          description: ISO timestamp for polling - returns only entries newer than this
          schema:
            type: string
            format: date-time
        - name: scan_id
          in: query
          description: Filter by scan/job run ID. Use "system" for non-scan logs
          schema:
            type: string
        - name: level
          in: query
          description: Minimum log level filter
          schema:
            type: string
            enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
        - name: search
          in: query
          description: Search text (case-insensitive match on message)
          schema:
            type: string
        - name: start_time
          in: query
          description: Start of time range filter (ISO timestamp)
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: End of time range filter (ISO timestamp)
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 200
            maximum: 1000
      responses:
        '200':
          description: Log entries retrieved successfully

  /logs/runs:
    get:
      summary: List log runs (job history)
      description: |
        Get distinct scan/job runs that have associated log entries,
        with log counts and time ranges.

        **Example:**
        ```bash
        curl -X GET "http://your-server/api/logs/runs?scan_type=scheduled" \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Logs]
      parameters:
        - name: scan_type
          in: query
          description: Filter by scan type
          schema:
            type: string
            enum: [full, scheduled, pending, system]
      responses:
        '200':
          description: Log runs retrieved successfully

  /logs/download:
    get:
      summary: Download logs as text file
      description: |
        Download filtered logs as a plain text .log file.
        Accepts the same filter parameters as GET /logs (no pagination).
        Streams response with a 100k row cap.

        **Example:**
        ```bash
        curl -X GET "http://your-server/api/logs/download?level=WARNING" \
          -H "Authorization: Bearer YOUR_TOKEN" \
          --output pixelprobe-logs.log
        ```
      tags: [Logs]
      parameters:
        - name: scan_id
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
            enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
        - name: search
          in: query
          schema:
            type: string
        - name: start_time
          in: query
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Log file download
          content:
            text/plain:
              schema:
                type: string

  /logs/retention:
    get:
      summary: Get log retention settings
      description: |
        Get the current log retention period in days.

        **Example:**
        ```bash
        curl -X GET http://your-server/api/logs/retention \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Logs]
      responses:
        '200':
          description: Retention settings retrieved
    put:
      summary: Set log retention period
      description: |
        Configure how many days log entries are retained before automatic cleanup.

        **Example:**
        ```bash
        curl -X PUT http://your-server/api/logs/retention \
          -H "Authorization: Bearer YOUR_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"log_retention_days": 60}'
        ```
      tags: [Logs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [log_retention_days]
              properties:
                log_retention_days:
                  type: integer
                  minimum: 1
                  description: Number of days to retain logs
      responses:
        '200':
          description: Retention settings updated
        '400':
          description: Invalid retention value

  /logs/purge:
    post:
      summary: Purge log entries
      description: |
        Manually purge log entries matching the given filters.
        At least one filter parameter is required to prevent accidental full purge.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/logs/purge \
          -H "Authorization: Bearer YOUR_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"before": "2025-01-01T00:00:00Z"}'
        ```
      tags: [Logs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scan_id:
                  type: string
                  description: Purge logs for a specific scan ("system" for non-scan logs)
                before:
                  type: string
                  format: date-time
                  description: Purge logs older than this timestamp
                level:
                  type: string
                  enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
                  description: Purge logs at or above this level
      responses:
        '200':
          description: Logs purged successfully
        '400':
          description: At least one filter is required

tags:
  - name: Authentication
    description: User authentication, authorization, and API token management
  - name: System
    description: Application version and infrastructure component information
  - name: Scan
    description: Media file scanning operations, status monitoring, and scan management
  - name: Statistics
    description: Statistics, analytics, and trend data
  - name: Admin
    description: Administrative functions, settings, and system configuration
  - name: Healthcheck
    description: Healthchecks.io integration for monitoring scheduled scans
  - name: Export
    description: Data export operations and file download/streaming
  - name: Maintenance
    description: Maintenance, cleanup, and file change detection operations
  - name: Reports
    description: Scan report generation, management, and PDF export
  - name: Configuration
    description: Exclusions, patterns, and advanced configuration
  - name: Logs
    description: Log viewing, filtering, download, and retention management
