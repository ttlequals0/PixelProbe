  # Statistics Endpoints
  /stats:
    get:
      summary: Get statistics summary
      description: |
        Retrieve statistics about scanned files and corruption. The response
        includes an `integrity` block with rolling-coverage numbers: files
        integrity-checked ever and within the last 30 days, coverage percent,
        never-checked count, the oldest check date (every checked file has
        been verified at least once since then), and the current
        bitrot-suspected count.

        **Example:**
        ```bash
        curl -X GET http://your-server/api/stats \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Statistics]
      responses:
        '200':
          description: Statistics retrieved successfully

  /stats/trends:
    get:
      summary: Get scan counter metrics and trends
      description: |
        Returns scan counter metrics over time with daily breakdown.

        **Query Parameters:**
        - `days` (optional): Number of days to include (default: 30, max: 365)

        **Example:**
        ```bash
        curl -X GET "http://your-server/api/stats/trends?days=30" \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Statistics]
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 365
          description: Number of days of historical data to retrieve
      responses:
        '200':
          description: Scan trends data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  period_days:
                    type: integer
                  daily_trends:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        scan_count:
                          type: integer
                        files_scanned:
                          type: integer
                        corrupted_count:
                          type: integer
                        errors_count:
                          type: integer
                        warnings_count:
                          type: integer
                  summary:
                    type: object
                    properties:
                      total_scans:
                        type: integer
                      total_files_scanned:
                        type: integer
                      total_corrupted:
                        type: integer
                      avg_duration:
                        type: number
        '400':
          description: Invalid parameters
        '401':
          description: Unauthorized

  /stats/duration-histogram:
    get:
      summary: Get scan duration histogram
      description: |
        Returns a histogram of scan durations grouped into buckets.

        **Query Parameters:**
        - `days` (optional): Number of days to include (default: 30, max: 365)
        - `buckets` (optional): Number of histogram buckets (default: 10, min: 2, max: 50)

        **Example:**
        ```bash
        curl -X GET "http://your-server/api/stats/duration-histogram?days=30&buckets=10" \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Statistics]
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 365
          description: Number of days of historical data
        - in: query
          name: buckets
          schema:
            type: integer
            default: 10
            minimum: 2
            maximum: 50
          description: Number of histogram buckets
      responses:
        '200':
          description: Duration histogram retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  period_days:
                    type: integer
                  bucket_count:
                    type: integer
                  histogram:
                    type: array
                    items:
                      type: object
                      properties:
                        bucket_index:
                          type: integer
                        min_duration:
                          type: number
                        max_duration:
                          type: number
                        count:
                          type: integer
                  summary:
                    type: object
                    properties:
                      total_scans:
                        type: integer
                      min_duration:
                        type: number
                      max_duration:
                        type: number
                      avg_duration:
                        type: number
                  by_scan_type:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        count:
                          type: integer
                        min:
                          type: number
                        max:
                          type: number
                        avg:
                          type: number
        '400':
          description: Invalid parameters
        '401':
          description: Unauthorized

