openapi: 3.0.3
info:
  title: PixelProbe API
  # Version is dynamically set from version.py when served via /api/openapi.yaml
  version: 0.0.0
  description: |
    # PixelProbe REST API

    PixelProbe is a comprehensive media file corruption detection system that uses FFmpeg and other tools to scan and validate media files.

    ## Getting Started

    ### First-Time Setup

    1. Check if setup is required:
       ```bash
       curl -X GET http://your-server/api/auth/status
       ```

    2. If `first_run: true`, create admin account:
       ```bash
       curl -X POST http://your-server/api/auth/setup \
         -H "Content-Type: application/json" \
         -d '{"password": "your-secure-password"}'
       ```

    3. Login to get session cookie:
       ```bash
       curl -X POST http://your-server/api/auth/login \
         -H "Content-Type: application/json" \
         -d '{"username": "admin", "password": "your-secure-password"}' \
         -c cookies.txt
       ```

    ### Authentication Overview

    PixelProbe supports two authentication methods:

    #### Session-Based Authentication
    Used by the web interface. Login via `/auth/login` to receive a session cookie.

    #### API Token Authentication
    Recommended for programmatic access:

    1. Create an API token:
       ```bash
       curl -X POST http://your-server/api/tokens \
         -H "Content-Type: application/json" \
         -b cookies.txt \
         -d '{
           "description": "My automation script",
           "expires_in_days": 365
         }'
       ```

    2. Use the token in subsequent requests:
       ```bash
       curl -X GET http://your-server/api/scan-status \
         -H "Authorization: Bearer YOUR_TOKEN_HERE"
       ```

    ## Common Workflows

    ### Starting a Media Scan

    1. Configure scan directories (one-time setup):
       ```bash
       curl -X POST http://your-server/api/admin/scan-config \
         -H "Authorization: Bearer YOUR_TOKEN" \
         -H "Content-Type: application/json" \
         -d '{
           "path": "/mnt/media",
           "is_active": true
         }'
       ```

    2. Start a full scan:
       ```bash
       curl -X POST http://your-server/api/scan \
         -H "Authorization: Bearer YOUR_TOKEN" \
         -H "Content-Type: application/json" \
         -d '{"force_rescan": false}'
       ```

    3. Monitor scan progress:
       ```bash
       curl -X GET http://your-server/api/scan-status \
         -H "Authorization: Bearer YOUR_TOKEN"
       ```

    ### Retrieving Scan Results

    1. Get corrupted files:
       ```bash
       curl -X GET "http://your-server/api/scan-results?is_corrupted=true&page=1&per_page=50" \
         -H "Authorization: Bearer YOUR_TOKEN"
       ```

    2. Search for specific files:
       ```bash
       curl -X GET "http://your-server/api/scan-results?search=movie.mp4" \
         -H "Authorization: Bearer YOUR_TOKEN"
       ```

    3. Export results to CSV:
       ```bash
       curl -X POST http://your-server/api/export \
         -H "Authorization: Bearer YOUR_TOKEN" \
         -H "Content-Type: application/json" \
         -d '{"format": "csv", "include_all": false}'
       ```

    ### Handling Scan Issues

    If a scan gets stuck:

    1. Check worker status:
       ```bash
       curl -X GET http://your-server/api/worker-status \
         -H "Authorization: Bearer YOUR_TOKEN"
       ```

    2. Force cleanup:
       ```bash
       curl -X POST http://your-server/api/scan/recovery \
         -H "Authorization: Bearer YOUR_TOKEN"
       ```

    3. Restart the scan:
       ```bash
       curl -X POST http://your-server/api/scan \
         -H "Authorization: Bearer YOUR_TOKEN"
       ```

  contact:
    name: PixelProbe
    url: https://github.com/ttlequals0/pixelprobe

servers:
  - url: /api
    description: Main API endpoint

security:
  - bearerAuth: []
  - sessionAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication using API tokens
    sessionAuth:
      type: apiKey
      in: cookie
      name: session
      description: Session-based authentication via login

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message

    ScanResult:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the scan result
        file_path:
          type: string
          description: Full path to the scanned file
        file_name:
          type: string
          description: Name of the file
        file_size:
          type: integer
          description: File size in bytes
        file_type:
          type: string
          description: File MIME type or extension
        scan_status:
          type: string
          enum: [pending, scanning, completed, error]
          description: Current status of the scan
        is_corrupted:
          type: boolean
          description: Whether the file is corrupted
        marked_as_good:
          type: boolean
          description: User-marked as not corrupted (false positive)
        has_warnings:
          type: boolean
          description: Whether scan produced warnings
        scan_date:
          type: string
          format: date-time
          description: When the file was last scanned
        discovered_date:
          type: string
          format: date-time
          description: When the file was first discovered
        scan_output:
          type: string
          description: Full output from the scanning tool
        error_message:
          type: string
          description: Error message if scan failed
        scan_tool:
          type: string
          description: Tool used for scanning (e.g., FFmpeg)
        scan_duration:
          type: number
          description: How long the scan took in seconds

    ScanStatus:
      type: object
      properties:
        current:
          type: integer
          description: Current files processed
        total:
          type: integer
          description: Total files to scan
        file:
          type: string
          description: Current file being scanned
        status:
          type: string
          description: Current scan status message
        is_running:
          type: boolean
          description: Whether a scan is actively running
        is_active:
          type: boolean
          description: Whether scan is active
        scan_id:
          type: string
          description: Unique identifier for this scan
        start_time:
          type: string
          format: date-time
          description: When the scan started
        end_time:
          type: string
          format: date-time
          description: When the scan ended
        phase:
          type: string
          enum: [idle, discovering, adding, scanning, completed, error, crashed, cancelled]
          description: Current phase of the scan
        phase_number:
          type: integer
          description: Current phase number
        total_phases:
          type: integer
          description: Total number of phases
        progress_message:
          type: string
          description: Human-readable progress message
        eta:
          type: string
          format: date-time
          description: Estimated time of completion
        files_per_second:
          type: number
          description: Current scanning speed

    HealthcheckConfig:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the healthcheck configuration
        schedule_id:
          type: integer
          description: ID of the associated schedule
        schedule_name:
          type: string
          description: Name of the associated schedule
        healthcheck_url:
          type: string
          format: uri
          description: Healthchecks.io ping URL
        is_active:
          type: boolean
          description: Whether healthcheck pings are enabled
        send_start_ping:
          type: boolean
          description: Send ping when scan starts (using /start slug)
        send_success_ping:
          type: boolean
          description: Send ping when scan completes successfully
        send_failure_ping:
          type: boolean
          description: Send ping when scan fails (using /fail slug)
        include_report_data:
          type: boolean
          description: Include scan results summary in success pings
        last_ping_status:
          type: string
          enum: [success, failure]
          description: Status of the last ping sent
        last_ping_time:
          type: string
          format: date-time
          description: Timestamp of the last ping
        created_at:
          type: string
          format: date-time
          description: When the configuration was created
        updated_at:
          type: string
          format: date-time
          description: When the configuration was last updated

paths:
  # Authentication Endpoints
  /auth/status:
    get:
      summary: Check authentication status
      description: |
        Returns the current authentication status and whether this is the first run requiring setup.

        **Use this endpoint to:**
        - Check if the user is authenticated
        - Determine if first-time setup is needed
        - Get current user information

        **Example:**
        ```bash
        curl -X GET http://your-server/api/auth/status
        ```

        **Response:**
        ```json
        {
          "authenticated": false,
          "first_run": true,
          "user": null
        }
        ```
      tags: [Authentication]
      security: []
      responses:
        '200':
          description: Authentication status retrieved successfully

  /auth/login:
    post:
      summary: User login
      description: |
        Authenticate with username and password to receive a session cookie.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/auth/login \
          -H "Content-Type: application/json" \
          -c cookies.txt \
          -d '{
            "username": "admin",
            "password": "your-password",
            "remember": true
          }'
        ```
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                remember:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /auth/logout:
    post:
      summary: User logout
      description: |
        Logout and invalidate the current session.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/auth/logout \
          -b cookies.txt
        ```
      tags: [Authentication]
      responses:
        '200':
          description: Logout successful

  /auth/setup:
    post:
      summary: First-run setup
      description: |
        Initialize PixelProbe with the admin password on first run.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/auth/setup \
          -H "Content-Type: application/json" \
          -d '{"password": "your-secure-password"}'
        ```
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Setup completed successfully
        '400':
          description: Invalid request or setup already completed

  /users:
    get:
      summary: List all users
      description: |
        Retrieve a list of all user accounts (admin only).

        **Example:**
        ```bash
        curl -X GET http://your-server/api/users \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Authentication]
      responses:
        '200':
          description: List of users retrieved successfully

    post:
      summary: Create new user
      description: |
        Create a new user account with specified credentials and permissions (admin only).

        **Example:**
        ```bash
        curl -X POST http://your-server/api/users \
          -H "Authorization: Bearer YOUR_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "username": "newuser",
            "email": "newuser@example.com",
            "password": "secure-password",
            "is_admin": false
          }'
        ```
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
                is_admin:
                  type: boolean
                  default: true
      responses:
        '200':
          description: User created successfully
        '400':
          description: Invalid request or username already exists

  /users/{user_id}:
    delete:
      summary: Delete user
      description: |
        Delete a user account by ID (admin only).

        **Example:**
        ```bash
        curl -X DELETE http://your-server/api/users/2 \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Authentication]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User deleted successfully
        '400':
          description: Cannot delete user
        '404':
          description: User not found

  /users/{user_id}/password:
    put:
      summary: Change user password
      description: |
        Change the password for a specific user account.

        **Example:**
        ```bash
        curl -X PUT http://your-server/api/users/1/password \
          -H "Authorization: Bearer YOUR_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "current_password": "old-password",
            "new_password": "new-secure-password"
          }'
        ```
      tags: [Authentication]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: Password changed successfully
        '401':
          description: Invalid current password

  /tokens:
    get:
      summary: List API tokens
      description: |
        Retrieve all API tokens for the current user.

        **Example:**
        ```bash
        curl -X GET http://your-server/api/tokens \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Authentication]
      responses:
        '200':
          description: List of API tokens retrieved successfully

    post:
      summary: Create API token
      description: |
        Generate a new API token for programmatic access.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/tokens \
          -H "Authorization: Bearer YOUR_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "description": "Monitoring script",
            "expires_in_days": 365
          }'
        ```
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description:
                  type: string
                expires_in_days:
                  type: integer
      responses:
        '200':
          description: Token created successfully

  /tokens/{token_id}:
    delete:
      summary: Revoke API token
      description: |
        Delete and revoke an API token by ID.

        **Example:**
        ```bash
        curl -X DELETE http://your-server/api/tokens/2 \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Authentication]
      parameters:
        - name: token_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Token revoked successfully
        '404':
          description: Token not found

  # Scan Endpoints
  /scan-results:
    get:
      summary: Get paginated scan results
      description: |
        Retrieve scan results with pagination, filtering, and sorting.

        **Example:**
        ```bash
        curl -X GET "http://your-server/api/scan-results?is_corrupted=true&page=1&per_page=50" \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Scan]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 100
        - name: scan_status
          in: query
          schema:
            type: string
            enum: [all, pending, scanning, completed, error]
            default: all
        - name: is_corrupted
          in: query
          schema:
            type: string
            enum: [all, 'true', 'false']
            default: all
        - name: has_warnings
          in: query
          schema:
            type: string
            enum: [all, 'true', 'false']
            default: all
        - name: bitrot_suspected
          in: query
          description: Filter files flagged as suspected bitrot (hash changed, mtime unchanged)
          schema:
            type: string
            enum: [all, 'true', 'false']
            default: all
        - name: search
          in: query
          schema:
            type: string
        - name: sort_field
          in: query
          schema:
            type: string
            enum: [scan_date, file_path, file_size, file_type, scan_duration]
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: path
          in: query
          description: Filter results by scan path prefix (must match a configured SCAN_PATHS entry)
          schema:
            type: string
      responses:
        '200':
          description: Scan results retrieved successfully

  /scan-results/{result_id}:
    get:
      summary: Get single scan result
      description: |
        Retrieve detailed information about a specific scan result.

        **Example:**
        ```bash
        curl -X GET http://your-server/api/scan-results/123 \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Scan]
      parameters:
        - name: result_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Scan result retrieved successfully
        '404':
          description: Result not found

  /scan-file:
    post:
      summary: Scan a single file
      description: |
        Initiate a scan of a single specific file.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/scan-file \
          -H "Authorization: Bearer YOUR_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"file_path": "/media/movies/example.mp4"}'
        ```
      tags: [Scan]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_path]
              properties:
                file_path:
                  type: string
      responses:
        '200':
          description: File scan initiated successfully
        '400':
          description: Invalid file path
        '404':
          description: File not found
        '409':
          description: Scan already in progress

  /scan:
    post:
      summary: Start full media scan
      description: |
        Initiate a full scan of all configured media directories. Since
        v2.6.49 the scan is chunk-distributed across all Celery workers.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/scan \
          -H "Authorization: Bearer YOUR_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "force_rescan": false,
            "directories": ["/media/movies", "/media/tv"]
          }'
        ```
      tags: [Scan]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force_rescan:
                  type: boolean
                  default: false
                directories:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Scan started successfully
        '400':
          description: Invalid request
        '409':
          description: Scan already in progress
        '503':
          description: Celery workers not available

  /scan-status:
    get:
      summary: Get current scan status
      description: |
        Retrieve real-time status and progress of the current scan.

        **Example:**
        ```bash
        curl -X GET http://your-server/api/scan-status \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Scan]
      responses:
        '200':
          description: Scan status retrieved successfully

  /cancel-scan:
    post:
      summary: Cancel current scan
      description: |
        Cancel the currently running scan gracefully.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/cancel-scan \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Scan]
      responses:
        '200':
          description: Scan cancellation initiated
        '400':
          description: No active scan to cancel

  /force-cleanup-scan:
    post:
      summary: Force cleanup stuck scans
      description: |
        Emergency recovery endpoint to forcefully clean up stuck or crashed scan states.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/force-cleanup-scan \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Scan]
      responses:
        '200':
          description: Scan states cleaned up successfully

  /scan/recovery:
    post:
      summary: Scan recovery
      description: |
        Recovers from stuck scan states. Alias for `/force-cleanup-scan`.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/scan/recovery \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Scan]
      responses:
        '200':
          description: Recovery completed successfully

  /scan-files-parallel:
    post:
      summary: Start parallel file scan (legacy)
      description: |
        Legacy parallel scanning endpoint. For directory scanning, prefer `/scan`;
        the `file_paths` form remains the supported way to rescan selected files.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/scan-files-parallel \
          -H "Authorization: Bearer YOUR_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "file_paths": ["/media/file1.mp4", "/media/file2.mkv"],
            "force_rescan": false,
            "num_workers": 4
          }'
        ```
      tags: [Scan]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                force_rescan:
                  type: boolean
                  default: false
                num_workers:
                  type: integer
                  default: 4
                directories:
                  type: array
                  items:
                    type: string
                file_paths:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Parallel scan started
        '409':
          description: Scan already in progress

  /scan-parallel:
    post:
      summary: Start parallel scan (deprecated alias of /scan)
      deprecated: true
      description: |
        Deprecated alias of `/scan` - both run the same chunk-distributed engine.
        Will be removed in a future major release.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/scan-parallel \
          -H "Authorization: Bearer YOUR_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "directories": ["/media/movies", "/media/tv"],
            "force_rescan": false
          }'
        ```
      tags: [Scan]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [directories]
              properties:
                directories:
                  type: array
                  items:
                    type: string
                force_rescan:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Parallel scan started successfully
        '400':
          description: Invalid request
        '503':
          description: Celery workers not available

  /reset-for-rescan:
    post:
      summary: Reset files for rescanning
      description: |
        Reset files for rescanning based on criteria.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/reset-for-rescan \
          -H "Authorization: Bearer YOUR_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "type": "corrupted"
          }'
        ```
      tags: [Scan]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [all, selected, corrupted, error]
                file_ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Files reset successfully

  /force-scan-pending:
    post:
      summary: Force scan all pending files
      description: |
        Force a scan of all files currently in pending state.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/force-scan-pending \
          -H "Authorization: Bearer YOUR_TOKEN"
        ```
      tags: [Scan]
      responses:
        '200':
          description: Pending files scan started
        '409':
          description: Scan already in progress

  /reset-files-by-path:
    post:
      summary: Reset specific files by path
      description: |
        Reset one or more files to pending state using their file paths.

        **Example:**
        ```bash
        curl -X POST http://your-server/api/reset-files-by-path \
          -H "Authorization: Bearer YOUR_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "file_paths": [
              "/media/movies/file1.mp4",
              "/media/movies/file2.mkv"
            ]
          }'
        ```
      tags: [Scan]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                file_path:
                  type: string
                file_paths:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Files reset successfully

  /reset-incomplete-scans:
    post:
      summary: Reset incomplete scans
      description: |
        Find and reset files with incomplete scan data (showing 'N/A' for Tool Details and Scan Date).

        **Example:**
        ```bash
