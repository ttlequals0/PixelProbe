[pytest]
testpaths = tests scripts
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    real_media: marks tests that require real media files (deselect with '-m "not real_media"')
    postgres: marks tests that require a live PostgreSQL (set PIXELPROBE_TEST_POSTGRES_URI)
    timeout: sets a timeout for test execution