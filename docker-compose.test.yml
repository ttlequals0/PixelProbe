# Docker Compose configuration for testing PixelProbe v2.4.0
# Test deployment with authentication features

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: pixelprobe-test-postgres
    environment:
      POSTGRES_DB: pixelprobe
      POSTGRES_USER: pixelprobe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testpass123}
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelprobe"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pixelprobe-test-network

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: pixelprobe-test-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pixelprobe-test-network

  # PixelProbe application
  pixelprobe:
    image: ttlequals0/pixelprobe:2.4
    container_name: pixelprobe-test-app
    environment:
      # Security
      SECRET_KEY: ${SECRET_KEY:-test-secret-key-for-auth-testing-v240}

      # PostgreSQL database configuration
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pixelprobe
      POSTGRES_USER: pixelprobe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testpass123}

      # Celery configuration
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      # Application settings
      FLASK_ENV: ${FLASK_ENV:-development}
      SCAN_PATHS: ${SCAN_PATHS:-/media}
      EXCLUDED_PATHS: ${EXCLUDED_PATHS:-}
      EXCLUDED_EXTENSIONS: ${EXCLUDED_EXTENSIONS:-.txt,.log,.md}
      MAX_WORKERS: ${MAX_WORKERS:-10}
      BATCH_SIZE: ${BATCH_SIZE:-100}
      MAX_OUTPUT_SIZE: ${MAX_OUTPUT_SIZE:-10000}
      OUTPUT_ROTATION_ENABLED: ${OUTPUT_ROTATION_ENABLED:-true}
      TZ: America/New_York

      # Scheduled scans
      PERIODIC_SCAN_SCHEDULE: ${PERIODIC_SCAN_SCHEDULE:-}
      CLEANUP_SCHEDULE: ${CLEANUP_SCHEDULE:-}

    volumes:
      # Media files to scan
      - ${MEDIA_PATH:-/tmp/test-media}:/media:ro

      # Instance folder for configs
      - ./instance:/app/instance

    ports:
      - "${PORT:-5001}:5000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - pixelprobe-test-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker for distributed task processing
  celery-worker:
    image: ttlequals0/pixelprobe:2.4
    container_name: pixelprobe-test-celery-worker
    command: python celery_worker.py
    environment:
      # Celery configuration
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_LOG_LEVEL: ${CELERY_LOG_LEVEL:-INFO}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-4}

      # Database connection
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pixelprobe
      POSTGRES_USER: pixelprobe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testpass123}

      # Worker-specific settings
      SECRET_KEY: ${SECRET_KEY:-test-secret-key-for-auth-testing-v240}
      FLASK_ENV: ${FLASK_ENV:-development}

    volumes:
      # Media files access (read-only for scanning)
      - ${MEDIA_PATH:-/tmp/test-media}:/media:ro

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - pixelprobe-test-network

    restart: unless-stopped

networks:
  pixelprobe-test-network:
    driver: bridge

volumes:
  test_postgres_data: